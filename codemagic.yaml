workflows:
  ios-unsigned-ipa:
    name: Glowboard iOS (unsigned IPA)
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen || brew upgrade xcodegen || true
      - name: Generate Xcode project
        script: xcodegen
      - name: Build unsigned app
        script: |
          set -e
          xcodebuild \
            -project Glowboard.xcodeproj \
            -scheme Glowboard \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Package unsigned IPA
        script: |
          set -e
          rm -rf Payload Glowboard-unsigned.ipa
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Glowboard.app Payload/
          zip -qr Glowboard-unsigned.ipa Payload
    artifacts:
      - Glowboard-unsigned.ipa
