name: Glowboard
options:
  bundleIdPrefix: com.glowboard
  deploymentTarget: "16.0"
  createIntermediateGroups: true

targets:
  Glowboard:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    settings:
      base:
        INFOPLIST_FILE: Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.glowboard.app
        PRODUCT_NAME: Glowboard
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
